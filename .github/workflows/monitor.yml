name: pokemon-monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub may start runs a few minutes late at busy times
  workflow_dispatch:

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # lets each run queue the next one

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: echo "START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # state.json (seen products, price cache, sent alerts) lives in the Actions cache, not the repo
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      # full scan, then watch sold-out profitable boxes every minute until the next run takes over
      - name: Scan stores, send alerts, watch restocks
        run: python monitor.py --watch-until=$(( START + 270 ))
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: always() && hashFiles('state.json') != ''
        with:
          path: state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      # GitHub pauses schedules after 60 days without commits; an empty commit every ~50 days prevents that
      - name: Keep schedule alive
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 4320000 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi

      # GitHub's cron is unreliable (runs late or not at all), so each run books the next one
      # roughly 5 minutes after it started. The cron above stays as a backup.
      - name: Queue next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wait=$(( 285 - ($(date +%s) - START) ))
          [ $wait -gt 0 ] && sleep $wait
          others=$(gh run list --workflow monitor.yml --limit 10 --json databaseId,status \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }} and .status != \"completed\")] | length")
          if [ "$others" = "0" ]; then gh workflow run monitor.yml --ref main; else echo "next run already queued"; fi

      # The Telegram check's own cron never fires reliably, and the Mac that used to start it is often
      # on a network that blocks GitHub. This chain runs every ~5 min, so it starts the check instead
      # whenever the last one is over 9 minutes old (the check keeps its own job so failures still email).
      - name: Start Telegram check if due
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --workflow telegram-check.yml --limit 1 --json createdAt --jq '.[0].createdAt // ""')
          age=$(( $(date +%s) - $( [ -n "$last" ] && date -d "$last" +%s || echo 0 ) ))
          if [ $age -gt 540 ]; then gh workflow run telegram-check.yml --ref main && echo "telegram check started"; else echo "telegram check ran ${age}s ago"; fi
