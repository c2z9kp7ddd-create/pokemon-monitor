name: telegram-check

# Independent of the Mac's network: checks every 10 minutes that the Telegram bot token is accepted
# and the bot can reach the alert chat. Silent while fine. When Telegram is broken the job fails,
# so GitHub emails the repo owner (guards.py fails a run only when a problem is new, then every 6 h).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: telegram-check
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # restarts the monitor's run chain if it has stopped

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: echo "START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: health/cloud_alerts.json
          key: tgcheck-${{ github.run_id }}
          restore-keys: tgcheck-

      - name: Check Telegram
        run: python3 guards.py telegram --cloud
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: always() && hashFiles('health/cloud_alerts.json') != ''
        with:
          path: health/cloud_alerts.json
          key: tgcheck-${{ github.run_id }}-${{ github.run_attempt }}

      # Its own run chain (cron here rarely fires): book the next check ~10 minutes after this one
      # started. The monitor chain and this chain each restart the other if it stops.
      - name: Queue next check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wait=$(( 600 - ($(date +%s) - START) ))
          [ $wait -gt 0 ] && sleep $wait
          others=$(gh run list --workflow telegram-check.yml --limit 10 --json databaseId,status \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }} and .status != \"completed\")] | length")
          if [ "$others" = "0" ]; then gh workflow run telegram-check.yml --ref main; else echo "next check already queued"; fi
